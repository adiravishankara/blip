<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blip</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #edf2f8;
        --panel: rgba(255, 255, 255, 0.97);
        --line: #d3ddeb;
        --line-strong: #b8c8de;
        --text: #172235;
        --muted: #677892;
        --muted-strong: #51637d;
        --blue: #1f5eff;
        --blue-dark: #1848c2;
        --blue-soft: #eaf0ff;
        --emerald: #167a52;
        --emerald-soft: #e6f5ee;
        --rose: #bf3a3a;
        --rose-soft: #fff0f0;
        --shadow: 0 18px 42px rgba(23, 34, 53, 0.12);
        --shadow-strong: 0 26px 52px rgba(23, 34, 53, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top right, rgba(78, 127, 255, 0.22) 0%, transparent 32%),
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.75) 0%, transparent 40%),
          linear-gradient(180deg, #f6f9fd 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "Segoe UI", "SF Pro Text", sans-serif;
      }

      .shell {
        padding: 12px 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        position: relative;
      }

      .logo-pill {
        width: 32px;
        height: 32px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(184, 200, 222, 0.9);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: -0.04em;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 10px 24px rgba(23, 34, 53, 0.18);
      }

      .profile-trigger {
        border-radius: 999px;
        border: 1px solid rgba(183, 198, 221, 0.9);
        background: linear-gradient(180deg, #f5f8fd 0%, #eaf0fa 100%);
        padding: 4px 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted-strong);
        cursor: pointer;
      }

      .profile-trigger-icon {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
      }

      .profile-menu {
        position: absolute;
        top: 36px;
        right: 0;
        background: var(--panel);
        border-radius: 14px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        padding: 8px;
        min-width: 160px;
        z-index: 10;
      }

      .profile-menu.hidden {
        display: none;
      }

      .profile-menu button,
      .profile-menu a {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 10px;
        background: transparent;
        border: 0;
        font-size: 13px;
        cursor: pointer;
        color: var(--text);
      }

      .profile-menu button:hover,
      .profile-menu a:hover {
        background: #eef2f8;
      }

      .hero p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.9);
        max-width: 28ch;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 16px;
        box-shadow: var(--shadow);
        margin-bottom: 12px;
        backdrop-filter: blur(12px);
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 11px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .pill.blue { background: var(--blue-soft); color: var(--blue); }
      .pill.green { background: var(--emerald-soft); color: var(--emerald); }
      .pill.red { background: var(--rose-soft); color: var(--rose); }
      .pill.gray { background: #eef2f8; color: var(--muted); }

      h2, h3 {
        margin: 0;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .meta {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .field {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 13px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
      }

      .field-label {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted-strong);
        margin-bottom: 6px;
      }

      .field-value {
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
      }

      .small {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }

      .results {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .result {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 12px 13px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      }

      .result-score {
        font-size: 20px;
        font-weight: 800;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 14px;
        margin-top: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      input:focus {
        outline: none;
        border-color: rgba(31, 94, 255, 0.45);
        box-shadow: 0 0 0 4px rgba(31, 94, 255, 0.08);
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .primary {
        background: linear-gradient(135deg, var(--blue), #4f83ff);
        color: white;
        box-shadow: 0 14px 28px rgba(31, 94, 255, 0.18);
      }

      .primary:hover {
        transform: translateY(-1px);
        background: linear-gradient(135deg, var(--blue-dark), #4272e4);
      }

      .secondary {
        background: linear-gradient(180deg, #f5f8fd 0%, #eaf0fa 100%);
        color: var(--text);
        border: 1px solid rgba(211, 221, 235, 0.85);
      }

      .secondary:hover {
        transform: translateY(-1px);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .status {
        min-height: 20px;
        font-size: 13px;
      }

      .good { color: var(--emerald); }
      .bad { color: var(--rose); }

      .empty {
        text-align: center;
        padding: 34px 18px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      a.link {
        color: var(--blue);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <button id="profile-trigger" class="profile-trigger" aria-label="Open account menu">
          <span class="profile-trigger-icon">•••</span>
        </button>
        <div id="profile-menu" class="profile-menu hidden" aria-label="Account menu">
          <button id="profile-open-web" type="button">Open Blip</button>
          <button id="profile-open-settings" type="button">Settings</button>
          <button id="profile-logout" type="button">Log out</button>
        </div>
        <div class="logo-pill" aria-label="Blip logo">b</div>
      </header>
      <main id="app-root"></main>
    </div>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
